name: __PROJECT_SLUG__

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      ASPNETCORE_ENVIRONMENT: Development

    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      API_BASE_URL: http://api:8080

    ports:
      - "3000:3000"

    depends_on:
      api:
        condition: service_started
