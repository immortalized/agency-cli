services:
  frontend:
    ports: !reset []
    networks: !override
      - application

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    environment:
      TLS_DOMAIN: ${TLS_DOMAIN:?set TLS_DOMAIN to the public hostname before using the TLS overlay}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy:/etc/caddy:ro
      - production_caddy_data:/data
      - production_caddy_config:/config
    networks:
      - public
      - application
    depends_on:
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

volumes:
  production_caddy_data:
  production_caddy_config:
